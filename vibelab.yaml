version:
  name: V0.1.0 万象画境 · 首版发布
  notes: |-
    万象画境首版发布。戴上 PICO 头显，让古典与当代画作从墙面缓缓展开。

    【双模式浏览】
    · 沉浸画廊：纵览水彩治愈、现代都市、霓虹夜色、梦境漫游四大主题。
    · MR 墙面模式：自动识别真实房间墙面，将画作直接陈列在空间中，可自由选择展示位置。

    【内容与交互】
    · 20 幅精选画作：四大主题各 5 幅，三联画式轮播同时呈现相邻作品，当前画作居中突出。
    · 手势追踪：捏合、拖拽即可切换主题与画作，无需手柄。
    · 视线追踪：目光停留即可聚焦卡片，选中更自然。
    · 手柄支持：摇杆/按键完成浏览与返回，三种交互方式随时可用。
    · 便捷返回：任意模式均可通过返回按钮回到模式选择界面。

    【体验提示】
    首次进入 MR 模式时请环视房间，待墙面识别完成后选择展示位置，效果最佳。

    本版本为首个公开版本，后续将持续扩充画作内容与空间交互体验。
