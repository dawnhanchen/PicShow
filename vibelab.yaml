app:
  id: "7703840230599573558"
  name: 万象画境
  slogan: 把美术馆搬进你的房间，让名画在真实墙面上触手可及。
  description: |
    「万象画境」是一款面向 PICO 的混合现实艺术画廊应用。

    戴上头显，家中的墙面会变成你的私人展厅：应用自动识别真实墙面与平面，将画作按墙面尺寸自适应排布；也可以进入沉浸画廊，在柔和光线下欣赏完整的主题画作。

    【四大主题】
    水彩治愈、现代都市、赛博朋克、超现实奇幻，每个主题 5 幅作品、共 20 幅；三联画式轮播让当前画作居中突出、相邻作品自然退后，切换主题与画作时保持位置连贯。

    【三种交互】
    手势追踪：捏合、拖拽即可切换主题与画作；
    视线追踪：目光停留即可聚焦卡片；
    手柄操作：摇杆与按键完成浏览、选择与返回。
    三种方式可自由混用，也可随时通过返回按钮回到模式选择，重新布置你的空间展厅。

    【适用场景】
    居家墙面装饰、客厅艺术氛围营造、艺术启蒙与展厅陈列。
